---
- name: Configure Docker on EC2 and deploy compose stack
  hosts: app
  become: true
  vars:
    app_dir: /home/ubuntu/app

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | regex_replace('x86_64', 'amd64') | regex_replace('aarch64', 'arm64') }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Install Docker Engine and Compose plugin
      apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy docker-compose.yml to EC2 host
      copy:
        src: ../docker-compose.app.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy backend/ (build context) to EC2 host
      copy:
        src: ../backend/
        dest: "{{ app_dir }}/backend/"
        owner: ubuntu
        group: ubuntu
        mode: preserve

    - name: Copy frontend/ (build context) to EC2 host
      copy:
        src: ../frontend/
        dest: "{{ app_dir }}/frontend/"
        owner: ubuntu
        group: ubuntu
        mode: preserve

    - name: Copy db/ (init.sql) to EC2 host
      copy:
        src: ../db/
        dest: "{{ app_dir }}/db/"
        owner: ubuntu
        group: ubuntu
        mode: preserve

    # docker-compose.yml uses defaults (pixeluser/pixelpass/pixelshooter) if no .env
    # is present, but we're using a real .env with a proper password:
    - name: Copy .env file to EC2 host
      copy:
        src: ../.env
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Build and start the docker compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        build: always
        state: present
      become: true