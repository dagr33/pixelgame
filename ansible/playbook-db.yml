---
- name: Install Docker
  hosts: db
  become: true
  vars:
    docker_version: "27.0.3"
    app_dir: /home/ubuntu/app

  tasks:
    - name: Check if Docker is already installed
      command: docker --version
      register: docker_check
      ignore_errors: true
      changed_when: false

    - name: Download Docker static binary (runs on control node, not DB host)
      get_url:
        url: "https://download.docker.com/linux/static/stable/x86_64/docker-{{ docker_version }}.tgz"
        dest: "/tmp/docker-{{ docker_version }}.tgz"
      delegate_to: localhost
      run_once: true
      when: docker_check.rc != 0

    - name: Copy Docker binary to DB host (over SSH via ProxyJump, no internet needed on DB host)
      copy:
        src: "/tmp/docker-{{ docker_version }}.tgz"
        dest: "/tmp/docker.tgz"
      when: docker_check.rc != 0

    - name: Extract Docker binaries
      unarchive:
        src: /tmp/docker.tgz
        dest: /tmp
        remote_src: true
      when: docker_check.rc != 0

    - name: Install Docker binaries to /usr/bin
      copy:
        src: "/tmp/docker/{{ item }}"
        dest: "/usr/bin/{{ item }}"
        mode: "0755"
        remote_src: true
      loop:
        - docker
        - dockerd
        - docker-init
        - docker-proxy
        - containerd
        - containerd-shim-runc-v2
        - ctr
        - runc
      when: docker_check.rc != 0

    - name: Create docker systemd service
      copy:
        dest: /etc/systemd/system/docker.service
        content: |
          [Unit]
          Description=Docker Engine
          After=network.target

          [Service]
          ExecStart=/usr/bin/dockerd
          Restart=always

          [Install]
          WantedBy=multi-user.target
      when: docker_check.rc != 0

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: true
        daemon_reload: true

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy docker-compose.db.yml
      copy:
        src: ../docker-compose.db.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy db/ (init.sql)
      copy:
        src: ../db/
        dest: "{{ app_dir }}/db/"
        owner: ubuntu
        group: ubuntu
        mode: preserve

    - name: Copy .env
      copy:
        src: ../.env
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Pull postgres image on control node, save as tar (only if needed)
      shell: |
        docker pull postgres:16-alpine
        docker save postgres:16-alpine -o /tmp/postgres.tar
      delegate_to: localhost
      run_once: true
      args:
        creates: /tmp/postgres.tar

    - name: Copy postgres image tar to DB host
      copy:
        src: /tmp/postgres.tar
        dest: /tmp/postgres.tar

    - name: Load postgres image on DB host
      command: docker load -i /tmp/postgres.tar
      environment:
        PATH: "/usr/bin:{{ ansible_env.PATH }}"

    - name: Start db compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
      become: true