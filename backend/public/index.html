<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixel Siege — Retro Shooter</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="stage">
    <h1 class="title">PIXEL SIEGE</h1>
    <div class="canvas-wrap">
      <canvas id="game" width="224" height="256"></canvas>

      <section id="screen-start" class="screen">
        <p>Defend the grid. Clear every wave.</p>
        <button id="btn-play" class="btn">PLAY</button>
        <button id="btn-leaderboard" class="btn btn-secondary">LEADERBOARD</button>
        <p class="hint">Arrows/WASD move &bull; Space to fire &bull; P to pause</p>
      </section>

      <section id="screen-gameover" class="screen hidden">
        <h2>GAME OVER</h2>
        <p>Score: <span id="final-score">0</span></p>
        <form id="form-score" autocomplete="off">
          <label for="player-name">Enter your initials</label>
          <input id="player-name" name="player-name" maxlength="16" minlength="1" pattern="[A-Za-z0-9 _-]{1,16}" required />
          <button type="submit" class="btn">SUBMIT SCORE</button>
        </form>
        <button id="btn-skip" class="btn btn-secondary">SKIP</button>
      </section>

      <section id="screen-leaderboard" class="screen hidden">
        <h2>TOP PILOTS</h2>
        <ol id="leaderboard-list"></ol>
        <button id="btn-back" class="btn">BACK</button>
      </section>

      <div id="touch-controls" class="touch-controls">
        <button id="touch-left" class="touch-btn" aria-label="Move left">&#9664;</button>
        <button id="touch-fire" class="touch-btn touch-fire" aria-label="Fire">&#9679;</button>
        <button id="touch-right" class="touch-btn" aria-label="Move right">&#9654;</button>
      </div>
    </div>
  </main>

  <script src="/js/sprites.js"></script>
  <script src="/js/input.js"></script>
  <script src="/js/network.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
